name: CourseGround CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: courseground
          POSTGRES_PASSWORD: courseground_ci_password
          POSTGRES_DB: courseground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courseground -d courseground"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://courseground:courseground_ci_password@localhost:5432/courseground
      APP_DATABASE_URL: postgresql+psycopg://courseground_app:courseground_app_ci_password@localhost:5432/courseground
      JWT_SECRET_KEY: courseground_ci_only_secret_key_not_for_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_CHAT_MODEL: qwen3:8b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_EMBEDDING_DIMENSIONS: 768

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Enable pgvector
        working-directory: backend
        run: |
          python -c "import psycopg; connection = psycopg.connect('postgresql://courseground:courseground_ci_password@localhost:5432/courseground'); connection.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.commit(); connection.close()"

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Provision limited application database role
        working-directory: backend
        run: |
          python -c "import psycopg; connection = psycopg.connect('postgresql://courseground:courseground_ci_password@localhost:5432/courseground'); connection.execute(\"CREATE ROLE courseground_app LOGIN PASSWORD 'courseground_app_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT\"); connection.execute('GRANT USAGE ON SCHEMA public TO courseground_app'); connection.execute('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO courseground_app'); connection.execute('ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO courseground_app'); connection.commit(); connection.close()"

      - name: Compile backend
        working-directory: backend
        run: python -m compileall app migrations

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    env:
      API_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build